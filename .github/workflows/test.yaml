name: Tests
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: formatting
        run: test -z "$(gofmt -l .)"

      - name: vet
        run: go vet ./...

      - name: tests
        run: go test -race -cover ./...

      - name: build
        run: go build ./...
